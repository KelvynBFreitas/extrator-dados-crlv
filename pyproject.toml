[project]
name = "extrator-dados-crlv"
version = "0.1.0"
description = "Extrator de dados de CRLV-e em PDF"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["crlv", "crlv-e", "detran", "veiculo", "pdf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["pymupdf>=1.24,<2"]

[project.scripts]
extrator-crlv = "extrator_dados_crlv.cli:main"

[project.optional-dependencies]
ocr = [
    "rapidocr-onnxruntime>=1.4.4,<2; python_version < '3.13'",
    "rapidocr>=3.10,<4; python_version >= '3.13'",
    "onnxruntime>=1.20; python_version >= '3.13'",
]

[dependency-groups]
dev = ["ruff>=0.9"]
notebooks = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.0",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.ipynb", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
